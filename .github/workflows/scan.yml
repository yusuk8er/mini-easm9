name: Yusuk8er-easm

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'asset (棚卸しのみ) / full (診断込み) / discover (関連ドメイン探索)'
        default: asset
  schedule:
    - cron: '0 20 * * 0'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false   # go.sum が無いので Go モジュールキャッシュは使わない

      # システムパッケージはホーム配下に入らないためキャッシュできない。
      # キャッシュの有無にかかわらず毎回導入する
      - name: install system packages
        run: |
          missing=""
          command -v dig  >/dev/null 2>&1 || missing="$missing dnsutils"
          command -v nmap >/dev/null 2>&1 || missing="$missing nmap"
          [ -f /usr/include/pcap.h ]      || missing="$missing libpcap-dev"

          if [ -n "$missing" ]; then
            echo "導入するパッケージ:$missing"
            # packages.microsoft.com が 403 を返して apt-get update 全体を
            # 失敗させることがある。今回使わないリポジトリなので外しておく
            sudo rm -f /etc/apt/sources.list.d/microsoft* \
                       /etc/apt/sources.list.d/azure-cli* 2>/dev/null || true
            sudo apt-get update || true
            sudo apt-get install -y $missing || true
          else
            echo "システムパッケージは導入済み"
          fi

      - name: cache go tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/.local/nuclei-templates
            ~/.config/nuclei
          # ツールを追加したらキーを変える。さもないと古いキャッシュが復元され
          # 新しいツールがインストールされない
          key: easm-gotools-v5

      - name: install go tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/tlsx/cmd/tlsx@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          # naabu は libpcap-dev が要る。導入に失敗しても止めない
          go install github.com/projectdiscovery/naabu/v2/cmd/naabu@latest || \
            echo "naabu の導入に失敗しました。ポートスキャンはスキップされます"

      - name: set PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: verify tools
        run: |
          echo "--- 導入結果 ---"
          fail=0
          for t in subfinder dnsx httpx tlsx nuclei naabu nmap dig jq; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "  $t: OK"
            else
              echo "  $t: なし"
              fail=1
            fi
          done
          [ "$fail" = "1" ] && echo "※ 一部のツールがありません。該当する検査はスキップされます"
          exit 0

      - name: discover related domains
        if: github.event.inputs.mode == 'discover'
        run: |
          python3 discover.py
          echo "### 関連ドメインの候補" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat candidates.csv >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: scan
        if: github.event.inputs.mode != 'discover'
        env:
          MODE: ${{ github.event.inputs.mode || 'full' }}
        run: bash scan.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easm-result
          path: snapshots/
          retention-days: 30

      - name: save snapshot
        run: |
          git config user.name Yusuk8er-easm
          git config user.email Yusuk8er-easm@users.noreply.github.com
          git add -A snapshots assets.csv risks.csv || true
          git commit -m "scan $(date -u +%F)" || echo "変更なし"
          git push || echo "push できませんでした"

      - name: summary
        if: always()
        run: python3 summary.py snapshots >> "$GITHUB_STEP_SUMMARY" || true
