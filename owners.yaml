# 資産の持ち主台帳
#
# シャドーIT検出の中心はこのファイルです。
# 「誰の資産か分かっているもの」をここに書いていくと、
# 書かれていないものが自動的に「持ち主不明」として浮かび上がります。
#
# 書き方（1行1エントリ、コロン区切り）:
#   ホスト名またはドメイン: 持ち主
#
# 後方一致します。ドメインを書けば配下のサブドメイン全部に効きます。
# より具体的な指定（長いホスト名）が優先されます。
#
# 例:
# example.co.jp: 情報システム部
# corp.example.co.jp: 広報チーム
# stg-api.example.co.jp: プラットフォーム部（検証環境・2026年3月まで）
