name: mini-easm

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'asset (棚卸しのみ) / full (診断込み) / validate (SQL検証のみ)'
        default: asset
  schedule:
    - cron: '0 20 * * 0'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false   # go.sum が無いので Go モジュールキャッシュは使わない

      - name: cache tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/.local/nuclei-templates
            ~/.config/nuclei
          # ツールを追加したらキーを変える。さもないと古いキャッシュが復元され
          # 新しいツールがインストールされない
          key: easm-tools-v4-nmap

      - name: install tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          # 足りないものだけ入れる。ランナーに最初から入っていることが多い
          missing=""
          command -v dig  >/dev/null 2>&1 || missing="$missing dnsutils"
          command -v nmap >/dev/null 2>&1 || missing="$missing nmap"
          [ -f /usr/include/pcap.h ]      || missing="$missing libpcap-dev"

          if [ -n "$missing" ]; then
            # packages.microsoft.com が 403 を返して apt-get update 全体を
            # 失敗させることがある。今回使わないリポジトリなので外しておく
            sudo rm -f /etc/apt/sources.list.d/microsoft* \
                       /etc/apt/sources.list.d/azure-cli* 2>/dev/null || true
            sudo apt-get update || true
            sudo apt-get install -y $missing || true
          fi

          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/tlsx/cmd/tlsx@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          # naabu は libpcap-dev が要る。導入に失敗しても止めない
          # （scan.sh 側でポートスキャンをスキップして続行する）
          go install github.com/projectdiscovery/naabu/v2/cmd/naabu@latest || \
            echo "naabu の導入に失敗しました。ポートスキャンはスキップされます"
          echo "$HOME/go/bin" >> $GITHUB_PATH

          echo "--- 導入結果 ---"
          for t in subfinder dnsx httpx tlsx nuclei naabu nmap dig; do
            if [ -x "$HOME/go/bin/$t" ] || command -v "$t" >/dev/null 2>&1; then
              echo "  $t: OK"
            else
              echo "  $t: なし"
            fi
          done

      - name: set PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: validate SQL
        if: github.event.inputs.mode == 'validate'
        run: |
          sudo /bin/sh -c "$(curl -fsSL https://steampipe.io/install/steampipe.sh)"
          bash validate-sql.sh aws azure gcp

      - name: install steampipe
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ]; then
            sudo /bin/sh -c "$(curl -fsSL https://steampipe.io/install/steampipe.sh)"
            steampipe plugin install aws
          else
            echo "AWS キー未設定のためスキップ"
          fi

      - name: scan
        if: github.event.inputs.mode != 'validate'
        env:
          MODE: ${{ github.event.inputs.mode || 'full' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-1
        run: bash scan.sh

      - uses: actions/upload-artifact@v4
        if: always() && github.event.inputs.mode != 'validate'
        with:
          name: easm-result
          path: snapshots/
          retention-days: 30

      - name: save snapshot
        if: github.event.inputs.mode != 'validate'
        run: |
          git config user.name mini-easm
          git config user.email mini-easm@users.noreply.github.com
          git add -A snapshots assets.csv risks.csv || true
          git commit -m "scan $(date -u +%F)" || echo "変更なし"
          git push || echo "push できませんでした"

      - name: report
        if: github.event.inputs.mode != 'validate'
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          bash report.sh > report.md || true
          cat report.md >> $GITHUB_STEP_SUMMARY
          if [ -n "$WEBHOOK" ]; then
            jq -Rs '{text: .}' report.md | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK"
          fi
