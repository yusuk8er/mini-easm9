function parseCSV(t){
  if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);   // Excel用のBOMを除去
  const rows=[];let f='',row=[],q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}
    else if(c!=='\r')f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  const head=rows.shift()||[];
  return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(head.map((h,i)=>[h.trim(),(r[i]||'').trim()])));
}

      const live=d.filter(r=>r.delta!=='removed');
      const c={shadow:0,known:0};
      live.forEach(r=>{if(c[r.state]!==undefined)c[r.state]++});
      const nw=d.filter(r=>r.delta==='new').length;
      const rm=d.filter(r=>r.delta==='removed').length;
      return [['資産',live.length,''],['新規',nw,'alarm'],['持ち主不明',c.shadow,'amber'],['消滅',rm,'']];
    },
    match:(r,f)=>f==='new'||f==='removed'?r.delta===f:(r.state===f&&r.delta!=='removed'),
    sort:(a,b)=>((a.delta==='new'?0:a.delta==='removed'?2:1)-(b.delta==='new'?0:b.delta==='removed'?2:1))
                ||({shadow:0,known:1}[a.state]??9)-({shadow:0,known:1}[b.state]??9)
                ||a.host.localeCompare(b.host),
    search:r=>r.host+r.owner+r.tech+r.ip+r.cname+r.cloud_resource_type,
    row:r=>`
      <td><div class="host">${esc(r.host)||'(名前なし)'}${deltaTag(r)}</div>
          <div class="sub">${esc(r.ip||r.cname||'')}</div></td>
      <td class="col-hide">${r.owner?`<div class="sub">${esc(r.owner)}</div>`:'<span class="flag f-alert">不明</span>'}</td>
      <td class="col-hide"><div class="sub">${esc(r.cloud_provider||'—')}${r.cloud_resource_type?' / '+esc(r.cloud_resource_type):''}</div></td>
      <td><span class="flag f-${ASSET_CLS[r.state]||'ok'}">${ASSET_LABEL[r.state]||r.state}</span></td>`
  }
};

function deltaTag(r){
  if(r.delta==='new')return '<span class="d-new">NEW</span>';
  if(r.delta==='removed')return '<span class="d-removed">消滅</span>';
  return '';
}

function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function setView(v){
  VIEW=v; filter='all'; query=''; sortKey='';
  document.getElementById('v-risk').setAttribute('aria-pressed',v==='risk');
  document.getElementById('v-asset').setAttribute('aria-pressed',v==='asset');
  document.getElementById('h1').textContent=CFG[v].title;
  render();
}

function view(){
  const cfg=CFG[VIEW];
  let d=cfg.data().filter(r=>{
    if(filter!=='all'&&!cfg.match(r,filter))return false;
    if(!query)return true;
    return cfg.search(r).toLowerCase().includes(query);
  });
  d.sort(sortKey?((a,b)=>((a[sortKey]||'')<(b[sortKey]||'')?-1:(a[sortKey]||'')>(b[sortKey]||'')?1:0)*(asc?1:-1)):cfg.sort);
  return d;
}

function render(){
  const cfg=CFG[VIEW], all=cfg.data(), v=view();

  document.getElementById('tiles').innerHTML=cfg.tiles(all)
    .map(([k,n,cl])=>`<div class="tile"><dt>${k}</dt><dd class="${cl}">${n}</dd></div>`).join('');

  document.getElementById('strip').innerHTML=all.map((r,i)=>{
    const c=cfg.cls(r);
    return `<button class="tick s-${c}" data-i="${i}" aria-label="${esc(r.host)}"></button>`;
  }).join('');

  document.getElementById('filters').innerHTML=
    cfg.filters.map(([f,l])=>`<button class="chip" data-f="${f}" aria-pressed="${filter===f}">${l}</button>`).join('')
    +`<input type="search" id="q" placeholder="${cfg.placeholder}" aria-label="絞り込み" value="${esc(query)}">`;

  document.getElementById('thead').innerHTML='<tr>'+cfg.cols.map(([k,l],i)=>
    `<th data-k="${k}" tabindex="0"${i>0&&i<cfg.cols.length-1?' class="col-hide"':''}>${l}</th>`).join('')+'</tr>';

  document.getElementById('rows').innerHTML=v.map(r=>
    `<tr class="r-${cfg.cls(r)} dl-${r.delta||'base'}">${cfg.row(r)}</tr>`).join('');

  document.getElementById('empty').hidden=v.length>0;
  document.getElementById('striphint').textContent=`${v.length} / ${all.length} 件表示`;
  document.querySelector('.striplabel span').textContent=cfg.striplabel;
  bind();
}

function bind(){
  document.querySelectorAll('#filters .chip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
  const q=document.getElementById('q');
  if(q)q.oninput=e=>{query=e.target.value.toLowerCase().trim();render()};
  document.querySelectorAll('#thead th').forEach(th=>{
    const go=()=>{const k=th.dataset.k;asc=(sortKey===k)?!asc:true;sortKey=k;render()};
    th.onclick=go;
    th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}};
  });
}

document.getElementById('strip').onclick=e=>{
  const t=e.target.closest('.tick');if(!t)return;
  query=(CFG[VIEW].data()[t.dataset.i]||{}).host?.toLowerCase()||'';render();
};

async function grab(name,demo){
  // build_report.py が生成した単一HTMLでは、データが埋め込まれている。
  // file:// で開いても fetch が使えないため、こちらを優先して読む
  const key = name.indexOf('risks') >= 0 ? 'risks' : 'assets';
  if(window.__EMBEDDED__ && window.__EMBEDDED__[key] !== undefined){
    return {rows:parseCSV(window.__EMBEDDED__[key]), live:true};
  }
  try{
    const r=await fetch(name,{cache:'no-store'});
    if(!r.ok)throw 0;
    return {rows:parseCSV(await r.text()),live:true};
  }catch{ return {rows:parseCSV(demo),live:false}; }
}

(async()=>{
  const a=await grab('assets.csv',DEMO_ASSETS);
  const r=await grab('risks.csv',DEMO_RISKS);
  ASSETS=a.rows; RISKS=r.rows;
  document.getElementById('meta').textContent=
    `${RISKS.length} risks · ${ASSETS.length} assets · ${new Date().toISOString().slice(0,10)}`;
  const stamp = (window.__EMBEDDED__ && window.__EMBEDDED__.generated) || '';
  document.getElementById('src').textContent =
    (a.live||r.live)
      ? (stamp ? 'スキャン日時: ' + stamp : 'source: assets.csv / risks.csv')
      : 'source: サンプルデータ（CSVが見つかりません）';
  render();
})();
</script>
